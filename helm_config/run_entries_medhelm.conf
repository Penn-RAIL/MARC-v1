# MedHELM benchmark: MARC pipeline vs. MedGemma baseline
#
# Usage:
#   1. Start both servers:
#        python server.py                  # MARC on port 8080
#        python baseline_server.py         # MedGemma baseline on port 8081
#
#   2. Run evaluation:
#        helm-run --conf-paths helm_config/run_entries_medhelm.conf \
#                 --suite marc-vs-medgemma --max-eval-instances 100

entries: [
  # --- MARC multi-agent pipeline ---
  {description: "pubmed_qa:model=marc/marc-v1,model_deployment=marc/marc-v1-http", priority: 1},
  {description: "medcalc_bench:model=marc/marc-v1,model_deployment=marc/marc-v1-http", priority: 1},
  {description: "medec:model=marc/marc-v1,model_deployment=marc/marc-v1-http", priority: 1},
  {description: "head_qa:model=marc/marc-v1,model_deployment=marc/marc-v1-http", priority: 1},
  {description: "medbullets:model=marc/marc-v1,model_deployment=marc/marc-v1-http", priority: 1},
  {description: "medhallu:model=marc/marc-v1,model_deployment=marc/marc-v1-http", priority: 1},
  {description: "race_based_med:model=marc/marc-v1,model_deployment=marc/marc-v1-http", priority: 2},
  {description: "ehr_sql:model=marc/marc-v1,model_deployment=marc/marc-v1-http", priority: 2},

  # --- MedGemma baseline (single model, no pipeline) ---
  {description: "pubmed_qa:model=medgemma/medgemma-4b-it,model_deployment=medgemma/medgemma-4b-it-http", priority: 1},
  {description: "medcalc_bench:model=medgemma/medgemma-4b-it,model_deployment=medgemma/medgemma-4b-it-http", priority: 1},
  {description: "medec:model=medgemma/medgemma-4b-it,model_deployment=medgemma/medgemma-4b-it-http", priority: 1},
  {description: "head_qa:model=medgemma/medgemma-4b-it,model_deployment=medgemma/medgemma-4b-it-http", priority: 1},
  {description: "medbullets:model=medgemma/medgemma-4b-it,model_deployment=medgemma/medgemma-4b-it-http", priority: 1},
  {description: "medhallu:model=medgemma/medgemma-4b-it,model_deployment=medgemma/medgemma-4b-it-http", priority: 1},
  {description: "race_based_med:model=medgemma/medgemma-4b-it,model_deployment=medgemma/medgemma-4b-it-http", priority: 2},
  {description: "ehr_sql:model=medgemma/medgemma-4b-it,model_deployment=medgemma/medgemma-4b-it-http", priority: 2},
]
