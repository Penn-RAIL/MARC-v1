# Benchmark configuration for MedHELM evaluation
# Feedback loop is disabled for faster single-pass evaluation.
# Use this config when running: MARC_CONFIG=config/agents_benchmark.yaml python server.py

agents:
  - name: "Agent 1"
    model: "google/medgemma-4b-it"
    backend: "local"
    prompt_file: "agent_1_prompt.txt"
    context_files: []
  - name: "Agent 2"
    model: "google/medgemma-4b-it"
    backend: "local"
    prompt_file: "agent_2_prompt.txt"
    context_files: ["data/knowledge/sample_knowledge.txt"]
  - name: "Agent 3"
    model: "google/medgemma-4b-it"
    backend: "local"
    prompt_file: "agent_3_prompt.txt"
    context_files: []

# Evaluator disabled for benchmarking speed
evaluator:
  enabled: false
  model: "google/medgemma-4b-it"
  backend: "local"
  prompt_file: "evaluator_prompt.txt"
  quality_threshold: 70
  max_iterations: 1

# Feedback loop disabled
feedback_loop:
  enabled: false
  verbose: false
