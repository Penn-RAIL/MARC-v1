[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marc-agents"
version = "0.1.0"
description = "A modular framework for multi-agent reasoning, coordination, and iterative refinement."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
keywords = ["radiology", "medical-ai", "langchain", "multi-agent", "nlp", "healthcare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "langchain-core",
    "langchain-google-genai",
    "google-generativeai",
    "langchain-ollama",
    "python-dotenv",
    "pydantic",
    "PyYAML",
]

[project.optional-dependencies]
rag = [
    "chromadb",
    "langchain-community",
    "langchain-text-splitters",
]
viz = [
    "pandas",
    "matplotlib",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "build",
]

[project.urls]
Repository = "https://github.com/Penn-RAIL/MARC-v1"

[project.scripts]
marc = "marc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
